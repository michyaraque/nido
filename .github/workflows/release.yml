name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf,arm-unknown-linux-musleabihf

      - uses: Swatinem/rust-cache@v2

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - run: cargo test

      # The version is the one in Cargo.toml: bump it there to publish a new release.
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag ya está publicada: no hay versión nueva."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # Static (musl) binaries: run on any Raspberry Pi OS regardless of glibc version.
      - name: Build
        if: steps.version.outputs.new == 'true'
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-musl
          cargo zigbuild --release --target armv7-unknown-linux-musleabihf
          cargo zigbuild --release --target arm-unknown-linux-musleabihf
          mkdir dist
          cp target/aarch64-unknown-linux-musl/release/nido dist/nido-aarch64
          cp target/armv7-unknown-linux-musleabihf/release/nido dist/nido-armv7
          cp target/arm-unknown-linux-musleabihf/release/nido dist/nido-armv6

      - name: Release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --title "Nido $TAG" --generate-notes
