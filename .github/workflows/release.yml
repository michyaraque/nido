name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The version is the one in Cargo.toml: bump it there to publish a new release.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag ya está publicada: no hay versión nueva."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # One job per board family, all at once. Static (musl) binaries run on any Raspberry Pi OS.
  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: aarch64-unknown-linux-musl, arch: aarch64 }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7 }
          - { target: arm-unknown-linux-musleabihf, arch: armv6 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      # The core and every plugin (plugins/*/), each its own static binary: nido-<arch>, nido-<name>-<arch>.
      - env:
          NIDO_REPO: ${{ github.repository }}
        run: |
          cargo zigbuild --release --workspace --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/nido nido-${{ matrix.arch }}
          for manifest in plugins/*/Cargo.toml; do
            bin=$(sed -n 's/^name = "\(.*\)"/\1/p' "$manifest" | head -1)
            cp "target/${{ matrix.target }}/release/$bin" "$bin-${{ matrix.arch }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nido-${{ matrix.arch }}
          path: nido*-${{ matrix.arch }}

  release:
    needs: [version, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Each plugin's own version and the oldest Nido it works with, for the Plugins page.
      - run: |
          {
            echo "["
            sep=""
            for m in plugins/*/Cargo.toml; do
              bin=$(sed -n 's/^name = "\(.*\)"/\1/p' "$m" | head -1)
              ver=$(sed -n 's/^version = "\(.*\)"/\1/p' "$m" | head -1)
              min=$(sed -n '/^\[package.metadata.nido\]/,/^\[/s/^min = "\(.*\)"/\1/p' "$m" | head -1)
              printf '%s  {"bin": "%s", "version": "%s", "min": "%s"}' "$sep" "$bin" "$ver" "${min:-0.0.0}"
              sep=",
          "
            done
            echo
            echo "]"
          } > dist/plugins.json
          cat dist/plugins.json
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Nido $TAG" --generate-notes
