[workspace]
members = [".", "plugins/recipes", "plugins/games", "plugins/devices"]

[package]
name = "nido"
version = "0.19.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt", "net", "macros", "time", "io-util"] }
rusqlite = { version = "0.37", features = ["bundled"] }
maud = "0.27"
serde = { version = "1", features = ["derive"] }
argon2 = "0.5"
getrandom = "0.3"
serde_json = "1"
serde_urlencoded = "0.7"
# Already in the build through axum: used to pass WebSocket connections on to plugins.
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
rten = "0.28"
rten-tensor = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
webp = { version = "0.3", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "std"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
